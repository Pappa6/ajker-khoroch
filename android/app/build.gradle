plugins { id 'com.android.application' }

android {
    namespace 'com.pappa6.ajkerkhoroch'
    compileSdk 34
    defaultConfig {
        applicationId 'com.pappa6.ajkerkhoroch'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(project.findProperty('akVersionCode') ?: '1')
        versionName project.findProperty('akVersionName') ?: '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
    // The app's web files are prepared into src/main/assets/www by prep_web.py before the build.
}
// No third-party libraries at all: only the Android framework.
