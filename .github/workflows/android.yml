name: Android app (APK)

# Builds the Android app from this repository's website (index.html + lib/) and android/.
# The result is an UNSIGNED, aligned APK. It is signed afterwards with the owner's private key,
# which is never stored in this repository or on GitHub.
on:
  push:
    branches: [main]
    paths: ["android/**", "index.html", "lib/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare the app's web files
        run: |
          mkdir -p out
          python3 android/prep_web.py 2>&1 | tee out/prep.log

      - name: Build the APK
        shell: bash
        run: |
          mkdir -p out
          gradle -p android --no-daemon assembleRelease -PakVersionCode=${{ github.run_number }} -PakVersionName=1.0.${{ github.run_number }} 2>&1 | tee out/build.log
          exit ${PIPESTATUS[0]}

      - name: Align and check the APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          mkdir -p out
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" out/app-unsigned-aligned.apk
          "$BT/zipalign" -c -p 4 out/app-unsigned-aligned.apk
          "$BT/aapt2" dump permissions out/app-unsigned-aligned.apk | tee out/permissions.txt
          if grep -q "android.permission.INTERNET" out/permissions.txt; then echo "INTERNET permission must not be present"; exit 1; fi
          "$BT/aapt2" dump badging out/app-unsigned-aligned.apk | head -5 > out/badging.txt
          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          sha256sum out/app-unsigned-aligned.apk out/apksigner.jar > out/sha256.txt
          # a throwaway test key, only to install the test copy on the emulator below
          keytool -genkeypair -keystore test.jks -storepass testpass -keypass testpass -alias t -keyalg RSA -keysize 2048 -validity 2 -dname "CN=test" -noprompt
          "$BT/apksigner" sign --ks test.jks --ks-pass pass:testpass --out test-signed.apk out/app-unsigned-aligned.apk
          echo "BT=$BT" >> "$GITHUB_ENV"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Try the app on an Android phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/emulator_check.sh

      - name: Publish the build to the apk-build branch
        if: always()
        run: |
          set -e
          mkdir -p out
          cd out
          git init -q
          git config user.name "apk-builder"
          git config user.email "apk-builder@users.noreply.github.com"
          echo "run ${{ github.run_number }} from ${{ github.sha }}" > build-info.txt
          git checkout -q -b apk-build
          git add -A
          git commit -q -m "APK build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-build
